<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamVox OBS Alert Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent !important;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: flex-start;
      padding: 24px;
    }

    /* Alert Container */
    #alert-stage {
      position: relative;
      width: 100%;
      max-width: 640px;
      min-height: 180px;
    }

    /* Main Alert Card */
    .alert-card {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      background: linear-gradient(135deg, rgba(17, 19, 34, 0.94) 0%, rgba(26, 21, 48, 0.95) 100%);
      border: 1.5px solid rgba(139, 92, 246, 0.4);
      border-radius: 20px;
      padding: 20px 24px;
      display: flex;
      gap: 18px;
      align-items: center;
      box-shadow: 
        0 12px 35px rgba(0, 0, 0, 0.6),
        0 0 25px rgba(139, 92, 246, 0.25),
        inset 0 1px 1px rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      opacity: 0;
      transform: translateY(-30px) scale(0.92);
      transition: all 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }

    /* Glowing Border Glow */
    .alert-card::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 22px;
      background: linear-gradient(90deg, #ec4899, #8b5cf6, #06b6d4, #10b981);
      z-index: -1;
      opacity: 0.6;
      filter: blur(8px);
      animation: borderGlowRotate 4s linear infinite;
    }

    @keyframes borderGlowRotate {
      0% { filter: hue-rotate(0deg) blur(8px); }
      100% { filter: hue-rotate(360deg) blur(8px); }
    }

    .alert-card.active {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .alert-card.closing {
      opacity: 0;
      transform: translateY(20px) scale(0.94);
      transition: all 0.4s ease-in;
    }

    /* Avatar & Badge */
    .alert-avatar-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .alert-avatar {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #8b5cf6;
      box-shadow: 0 0 15px rgba(139, 92, 246, 0.6);
      background: #1e1b4b;
    }

    .alert-badge {
      position: absolute;
      bottom: -4px;
      right: -4px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #0f172a;
      border: 2px solid #8b5cf6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }

    /* Content Area */
    .alert-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .alert-header {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .alert-tag {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(139, 92, 246, 0.25);
      color: #c4b5fd;
      border: 1px solid rgba(139, 92, 246, 0.4);
    }

    .alert-tag.tag-member {
      background: rgba(16, 185, 129, 0.25);
      color: #6ee7b7;
      border-color: rgba(16, 185, 129, 0.4);
    }

    .alert-tag.tag-mod {
      background: rgba(6, 182, 212, 0.25);
      color: #67e8f9;
      border-color: rgba(6, 182, 212, 0.4);
    }

    .alert-tag.tag-superchat {
      background: rgba(245, 158, 11, 0.25);
      color: #fde68a;
      border-color: rgba(245, 158, 11, 0.4);
    }

    .alert-username {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: #f8fafc;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 320px;
    }

    /* Speech Bubble / Message */
    .alert-bubble {
      position: relative;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 10px 14px;
      color: #f1f5f9;
      font-size: 16px;
      line-height: 1.45;
      font-weight: 600;
      word-break: break-word;
    }

    /* Audio wave animation */
    .alert-voice-wave {
      display: flex;
      align-items: center;
      gap: 3px;
      margin-left: auto;
      height: 18px;
    }

    .wave-bar {
      width: 3px;
      height: 6px;
      background: #a78bfa;
      border-radius: 2px;
      transition: height 0.15s ease;
    }

    .alert-card.speaking .wave-bar {
      animation: wavePulse 0.8s ease-in-out infinite alternate;
    }

    .alert-card.speaking .wave-bar:nth-child(2) { animation-delay: 0.15s; }
    .alert-card.speaking .wave-bar:nth-child(3) { animation-delay: 0.3s; }
    .alert-card.speaking .wave-bar:nth-child(4) { animation-delay: 0.45s; }

    @keyframes wavePulse {
      0% { height: 4px; background: #8b5cf6; }
      100% { height: 18px; background: #ec4899; }
    }

    /* OBS Browser Source helper banner for setup */
    #obs-hint {
      position: fixed;
      bottom: 12px;
      left: 12px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.35);
      background: rgba(0,0,0,0.5);
      padding: 4px 8px;
      border-radius: 6px;
      pointer-events: none;
      transition: opacity 1s ease;
    }
  </style>
</head>
<body>
  <div id="alert-stage">
    <div id="alert-card" class="alert-card">
      <div class="alert-avatar-wrap">
        <img id="alert-avatar" class="alert-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=Streamer" alt="Avatar">
        <div id="alert-badge" class="alert-badge">💬</div>
      </div>
      <div class="alert-content">
        <div class="alert-header">
          <span id="alert-tag" class="alert-tag">LIVE CHAT</span>
          <span id="alert-username" class="alert-username">Penonton</span>
          <div class="alert-voice-wave" title="Audio Status">
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
          </div>
        </div>
        <div id="alert-bubble" class="alert-bubble">
          Pesan akan muncul di sini...
        </div>
      </div>
    </div>
  </div>

  <div id="obs-hint">OBS Overlay Siap • Mendengarkan Chat Masuk</div>

  <script src="sound-effects.js"></script>
  <script src="tts-engine.js"></script>
  <script src="youtube-poller.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
